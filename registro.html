<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SpinZone - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>SpinZone</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <h2>Registro de Usuario</h2>
            <form id="form-registro" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre">
                    <span class="error-msg" id="error-nombre"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                    <span class="error-msg" id="error-email"></span>
                </div>
                <div class="form-group">
                    <label for="rut">RUT:</label>
                    <input type="text" id="rut">
                    <span class="error-msg" id="error-rut"></span>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password">
                    <span class="error-msg" id="error-password"></span>
                </div>
                <button type="submit" class="btn">Registrarse</button>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 SpinZone</p></footer>
    <script src="js/main.js"></script>
</body>
</html>s
