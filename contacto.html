<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinZone - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>SpinZone</h1>
        <nav>
            <ul>
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-container">
            <h2>Formulario de Registro / Contacto</h2>
            <form id="form-contacto" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
                    <span class="error-msg" id="error-nombre"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                    <span class="error-msg" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="rut">RUT / Identificación:</label>
                    <input type="text" id="rut" name="rut" placeholder="12345678-9">
                    <span class="error-msg" id="error-rut"></span>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>

                <button type="submit">Enviar Formulario</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpinZone. Todos los derechos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
